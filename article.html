      <span>/</span>
      <a href="index.html#posts" id="crumb-cat">文章</a>
    </nav>

    <article class="article">
      <header class="article-head">
        <a class="cat-tag" id="cat-tag" href="index.html#posts">文章</a>
        <h1 id="post-title">加载中…</h1>
        <p class="article-meta" id="post-meta"></p>
      </header>

      <div class="prose" id="post-body"></div>

      <nav class="post-nav" id="post-nav" aria-label="文章导航"></nav>

      <section class="engage" id="engage" hidden>
      <div class="like-row">
        <button class="like-btn" id="like-btn" type="button" aria-pressed="false" aria-label="为这篇文章点赞">
          <svg class="thumb" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 10.6 11.1 3a2 2 0 0 1 2.7 2.4L12.9 9h4.9a2 2 0 0 1 2 2.4l-1.1 6A2 2 0 0 1 16.7 19H7z"/>

          </svg>
          <span class="like-label">赞</span>
          <span class="like-count" id="like-count">0</span>
        </button>
      </div>

      <div class="comments" id="comments">
        <h2>评论</h2>
        <p class="comments-note">无需登录，填个昵称就能留言，发出立刻显示。</p>

        <div class="comment-list" id="comment-list"></div>

        <form class="comment-form" id="comment-form" novalidate>
          <input class="cf-name" name="name" type="text" maxlength="20" placeholder="昵称（可留空）" autocomplete="nickname">
          <textarea class="cf-body" name="body" rows="4" maxlength="800" required placeholder="说点什么…"></textarea>
          <input class="cf-hp" name="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="cf-foot">
            <button class="btn primary" type="submit">发表</button>
            <p class="comment-status" id="comment-status" role="status"></p>
          </div>
        </form>
      </div>
      </section>
    </article>

    <p class="back-home"><a href="index.html#posts">← 返回文章列表</a></p>
