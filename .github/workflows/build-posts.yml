name: Build posts

# 后台（Pages CMS）改了 content/posts/*.md 之后，自动重新生成 assets/posts.js
on:
  push:
    paths:
      - "content/**"
      - "scripts/build-posts.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate assets/posts.js
        run: node scripts/build-posts.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/posts.js
          if git diff --cached --quiet; then
            echo "posts.js 无变化，跳过提交"
          else
            git commit -m "chore: 由 content/posts 重新生成 posts.js"
            git push
          fi
